<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 824" role="img" aria-label="Octavin">
  <!-- El anillo de Octavin, medido del logo original.
       No es un trazo uniforme: los costados miden 47.5 y el techo 38,
       como la «O» de una tipografía. Dibujarlo con un stroke de grosor
       único lo volvería otra marca. Por eso van dos rectángulos
       redondeados y evenodd: el de fuera y el hueco de dentro. -->
  <rect width="824" height="824" fill="#222222"/>
  <path fill="#ffffff" fill-rule="evenodd" d="
    M 322.5 324 h 193 a 100.5 100.5 0 0 1 0 201 h -193 a 100.5 100.5 0 0 1 0 -201 z
    M 332.5 362 h 174  a 62.5 62.5 0 0 1 0 125 h -174 a 62.5 62.5 0 0 1 0 -125 z"/>
</svg>
